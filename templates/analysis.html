<!DOCTYPE html>
<html>
<head>
    <title>nn_eos — Train</title>
</head>
<body>
    <a href="/">&larr; Home</a>
    <h1>Analyze the data</h1>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <h3>Upload CSV</h3>
        <input type="file" name="csv_file" accept=".csv" required>

        <h3>Line Plot</h3>
        <label>Property:</label>
        <select name="property">
            <option value="rho">rho (density)</option>
            <option value="cs2">cs2 (speed of sound squared)</option>
            <option value="h">h (enthalpy)</option>
            <option value="cp">cp (heat capacity)</option>
        </select>
        <br><br>
        <button type="submit">Plot P, T vs property</button>

    </form>

    {% if plot_path %}
    <h3>Line plot: P, T vs {{ prop }}</h3>
    <img src="/{{ plot_path }}" width="500">
    {% endif %}
</body>
</html>
